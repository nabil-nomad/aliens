[project]
name = "aliens"
requires-python = ">=3.10"
version = "0.1.0"
description = "Alien Invasion Game in Python"
authors = [{ name = "Nabil Khalil", email = "nabilamirkhalil@gmail.com" }]
readme = "README.md"
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
test = [
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
